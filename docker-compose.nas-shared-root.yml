services:
  noctra:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${NOCTRA_PYTHON_BASE_IMAGE:-python:3.11-slim}
        NOCTRA_PIP_INDEX_URL: ${NOCTRA_PIP_INDEX_URL:-}
        NOCTRA_PIP_TRUSTED_HOST: ${NOCTRA_PIP_TRUSTED_HOST:-}
    container_name: noctra
    ports:
      - "${NOCTRA_PORT:-4020}:8000"
    volumes:
      - ${NOCTRA_MEDIA_BIND_ROOT:?set NOCTRA_MEDIA_BIND_ROOT}:${NOCTRA_MEDIA_BIND_ROOT:?set NOCTRA_MEDIA_BIND_ROOT}
      - ${NOCTRA_DATA_DIR:-./data}:/app/data
    environment:
      SOURCE_DIR: ${NOCTRA_SOURCE_DIR:?set NOCTRA_SOURCE_DIR}
      DIST_DIR: ${NOCTRA_DIST_DIR:?set NOCTRA_DIST_DIR}
      DB_PATH: /app/data/noctra.db
      NOCTRA_PROFILE: ${NOCTRA_PROFILE:-nas-docker}
      HTTP_PROXY: ${NOCTRA_HTTP_PROXY:-}
      HTTPS_PROXY: ${NOCTRA_HTTPS_PROXY:-}
      http_proxy: ${NOCTRA_HTTP_PROXY:-}
      https_proxy: ${NOCTRA_HTTPS_PROXY:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
